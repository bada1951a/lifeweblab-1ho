name: Revert Corrupted Posts Safely

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset Posts to Clean State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1시간 전 정상 발행 커밋(9b0fe34)의 src/data/post 상태로 통째로 롤백
          git checkout 9b0fe34 -- src/data/post/
          
          if git diff --staged --quiet; then
            echo "복구할 변경 사항이 없습니다."
          else
            git commit -m "revert: 12개 언어 전체 포스트 글자 잘림 전(9b0fe34)으로 일괄 복원"
            git push origin main
          fi
