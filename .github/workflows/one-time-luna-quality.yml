name: One-time Korean Luna Quality Sample (No Publish)
on:
  push:
    branches:
      - review/gpt6-luna-2-1-no-publish
    paths:
      - .quality-sample-trigger-once
permissions:
  contents: read
jobs:
  quality-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One paid Korean API sample, no publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/gpt-luna-single-sample.mjs
      - name: Save generated text for editorial review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: korean-luna-quality-review
          path: tmp-quality-review/ko-sample.md
          retention-days: 1
