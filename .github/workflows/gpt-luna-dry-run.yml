name: GPT Luna Safe Dry Run (2-1)
on:
  push:
    branches:
      - review/gpt6-luna-2-1-no-publish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check generate-all.mjs
      - name: No API, no publishing smoke test
        run: node generate-all.mjs --dry-run
      - name: Approved single Korean sample
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/gpt-luna-single-sample.mjs
