name: Auto Multi-Language Blog Publishing Pipeline (Unit 2-1)

on:
  schedule:
    - cron: '40 19 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write # 생성된 마크다운 글 커밋 및 푸시 권한

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Auto Publishing Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          node generate-all.mjs
          npm run build

      - name: Commit and Push New Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt .publish-retry-queue.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto published new multi-language posts"
            git push
          fi
