name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    # 한국 시간 기준: 매일 오전 2시 15분 (02:15 KST) 1회 발행
    # UTC 기준: 17:15 (전날)
    - cron: '15 17 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Multi-Language Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-all.mjs

      - name: Commit and Push New Posts & Updated Topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "chore: auto-publish 12-language blog posts with local images"
            git push
          fi
