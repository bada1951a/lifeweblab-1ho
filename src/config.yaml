site:
  name: 'LifeWeb Lab'
  site: 'https://lifeweblab.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false
  naverSiteVerificationId: false

# Metadata
metadata:
  title:
    default: 'LifeWeb Lab'
    template: '%s — LifeWeb Lab'
  description: 'Practical tech troubleshooting, error solutions, and real-world digital guides.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'LifeWeb Lab'
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
announcement:
  enabled: false

analytics:
  vendors:
    googleAnalytics:
      id: false
