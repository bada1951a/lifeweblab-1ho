site:
  name: 'Daily Insight'
  site: 'https://storydailyview.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false
  naverSiteVerificationId: '9c86fd610a91958080f6c85ad5168103b8a514ed'

# Metadata
metadata:
  title:
    default: 'Daily Insight'
    template: '%s — Daily Insight'
  description: 'Daily curated tech insights and troubleshooting guides'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Daily Insight'
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
announcement:
  enabled: false

analytics:
  vendors:
    googleAnalytics:
      id: 'G-9N381KKW13'
