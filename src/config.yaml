site:
  name: 'LifeWebLab'
  site: 'https://lifeweblab.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Metadata
metadata:
  title:
    default: 'LifeWebLab'
    template: '%s — LifeWebLab'
  description: 'Global Payment & Wire Transfer Troubleshooting, Business Invoicing, and Fintech Solutions.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'LifeWebLab'
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8 # 6개에서 8개로 최적화
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
announcement:
  enabled: false

analytics:
  vendors:
    googleAnalytics:
      id: 'G-9L4TLNMJCT'
